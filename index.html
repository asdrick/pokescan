<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéScan Ultimate</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
margin:0;
font-family:-apple-system,Arial;
background:#0b0b0b;
color:white;
}

header{
background:#e53935;
padding:14px;
text-align:center;
font-weight:800;
}

nav{
display:flex;
background:#1c1c1c;
position:sticky;
top:0;
}

nav button{
flex:1;
padding:12px;
border:none;
background:none;
color:white;
font-weight:700;
}

nav button:hover{
background:#2a2a2a;
}

.container{padding:12px;}

.card{
background:#1e1e1e;
padding:10px;
margin:10px 0;
border-radius:12px;
}

img{width:110px;border-radius:10px}

input,button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:8px;
}

button{
background:#2196f3;
color:white;
font-weight:700;
}

.small{font-size:12px;opacity:0.7}

.price{
color:#00e676;
font-weight:800;
}
</style>
</head>

<body>

<header>⚡ PokéScan ULTIMATE</header>

<nav>
<button onclick="show('scan')">Scan</button>
<button onclick="show('sets')">Séries</button>
<button onclick="show('search')">Recherche</button>
<button onclick="show('collection')">Collection</button>
</nav>

<div class="container">

<!-- SCAN -->
<div id="scan">

<h3>📸 Scan carte</h3>

<input type="file" id="img" accept="image/*" capture="environment">
<input type="text" id="manual" placeholder="Nom carte (optionnel)">
<button onclick="scanCard()">Scanner</button>

<div id="scanResult"></div>

</div>

<!-- SETS -->
<div id="sets" style="display:none">

<h3>📚 Séries Pokémon</h3>
<div id="setList"></div>
<div id="cardList"></div>

</div>

<!-- SEARCH -->
<div id="search" style="display:none">

<h3>🔎 Recherche</h3>

<input type="text" id="searchInput" placeholder="Ex: Pikachu 58 / Charizard base set">
<button onclick="searchCard()">Rechercher</button>

<div id="searchResult"></div>

</div>

<!-- COLLECTION -->
<div id="collection" style="display:none">

<h3>💰 Ma collection</h3>
<div id="collectionValue"></div>
<div id="colList"></div>

</div>

</div>

<script>

const API="https://api.pokemontcg.io/v2";

/* =====================
   COLLECTION + PRIX CACHE
===================== */
let collection = JSON.parse(localStorage.getItem("collection") || "{}");
let priceCache = JSON.parse(localStorage.getItem("priceCache") || "{}");

/* =====================
   LOAD SETS
===================== */
async function loadSets(){

let res = await fetch(API+"/sets");
let data = await res.json();

let sets = data.data;

sets.sort((a,b)=>new Date(a.releaseDate)-new Date(b.releaseDate));

document.getElementById("setList").innerHTML =
sets.map(s=>`
<div class="card" onclick="openSet('${s.id}')">
<b>${s.name}</b><br>
<span class="small">${s.releaseDate}</span>
</div>
`).join("");
}

/* =====================
   OPEN SET (CARDS CLIQUABLES)
===================== */
async function openSet(id){

document.getElementById("cardList").innerHTML="Chargement...";

let res = await fetch(API+`/cards?q=set.id:${id}&pageSize=150`);
let data = await res.json();

document.getElementById("cardList").innerHTML =
data.data.map(c=>`
<div class="card" onclick="openCard('${c.id}')">
<h4>${c.name}</h4>
<img src="${c.images.small}">
<p class="small">#${c.number}</p>
<button onclick='toggleCollection(${JSON.stringify(c)})'>
${collection[c.id] ? "✓ Déjà ajouté" : "+ Ajouter"}
</button>
</div>
`).join("");
}

/* =====================
   OUVRIR CARTE DETAIL
===================== */
async function openCard(id){

let res = await fetch(API+`/cards/${id}`);
let data = await res.json();

let c = data.data;

let price = await getPrice(c.id);

document.getElementById("searchResult").innerHTML=`
<div class="card">
<h2>${c.name}</h2>
<img src="${c.images.large}">
<p>${c.set.name} #${c.number}</p>
<p class="price">💰 ${price.toFixed(2)} €</p>

<button onclick='toggleCollection(${JSON.stringify(c)})'>
${collection[c.id] ? "✓ Déjà ajouté" : "+ Ajouter à la collection"}
</button>

</div>
`;

show("search");
}

/* =====================
   SCAN OCR
===================== */
async function scanCard(){

let file=document.getElementById("img").files[0];
let name=document.getElementById("manual").value;

if(file){
let text = await Tesseract.recognize(file,'eng')
.then(r=>r.data.text);

name=text.split("\n")[0];
}

name=name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();

let res = await fetch(API+`/cards?q=name:${name}&pageSize=5`);
let data = await res.json();

if(!data.data.length){
document.getElementById("scanResult").innerHTML="❌ introuvable";
return;
}

let c=data.data[0];

document.getElementById("scanResult").innerHTML=`
<div class="card" onclick="openCard('${c.id}')">
<h3>${c.name}</h3>
<img src="${c.images.small}">
<p>${c.set.name}</p>
<button onclick='toggleCollection(${JSON.stringify(c)})'>
${collection[c.id] ? "✓ Déjà ajouté" : "+ Ajouter"}
</button>
</div>
`;
}

/* =====================
   RECHERCHE
===================== */
async function searchCard(){

let q=document.getElementById("searchInput").value;

let res = await fetch(API+`/cards?q=${q}&pageSize=5`);
let data = await res.json();

document.getElementById("searchResult").innerHTML =
data.data.map(c=>`
<div class="card" onclick="openCard('${c.id}')">
<h3>${c.name}</h3>
<img src="${c.images.small}">
<p>${c.set.name} #${c.number}</p>
<button onclick='toggleCollection(${JSON.stringify(c)})'>
${collection[c.id] ? "✓ Déjà ajouté" : "+ Ajouter"}
</button>
</div>
`).join("");
}

/* =====================
   COLLECTION SYSTEM
===================== */
function toggleCollection(c){

if(collection[c.id]){
delete collection[c.id];
} else {
collection[c.id]={
name:c.name,
img:c.images.small,
set:c.set.name,
number:c.number
};
}

localStorage.setItem("collection",JSON.stringify(collection));

renderCollection();
}

/* =====================
   PRIX RÉEL (CARDMARKET)
===================== */
async function getPrice(id){

if(priceCache[id]) return priceCache[id];

let res = await fetch(API+`/cards/${id}`);
let data = await res.json();

let c = data.data;

let price =
c.cardmarket?.prices?.averageSellPrice ||
c.cardmarket?.prices?.lowPrice ||
0;

priceCache[id]=price;

localStorage.setItem("priceCache",JSON.stringify(priceCache));

return price;
}

/* =====================
   COLLECTION DISPLAY
===================== */
async function renderCollection(){

let container=document.getElementById("colList");
let total=0;

let html="";

for(let id in collection){

let c=collection[id];
let price=await getPrice(id);

total+=price;

html+=`
<div class="card">
<h3>${c.name}</h3>
<img src="${c.img}">
<p>${c.set} #${c.number}</p>
<p class="price">💰 ${price.toFixed(2)} €</p>
</div>
`;
}

document.getElementById("collectionValue").innerHTML=
`<h2>Total: ${total.toFixed(2)} €</h2>`;

container.innerHTML=html;
}

/* =====================
   NAV
===================== */
function show(tab){

document.querySelectorAll(".container > div")
.forEach(d=>d.style.display="none");

document.getElementById(tab).style.display="block";

if(tab==="sets") loadSets();
if(tab==="collection") renderCollection();
}

show("scan");

</script>

</body>
</html>
